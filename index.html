<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 Things! — Miss Telmard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 10% 15%, #fff36d 0 7%, transparent 7.5%),
      radial-gradient(circle at 88% 12%, #ff78b5 0 9%, transparent 9.5%),
      radial-gradient(circle at 8% 88%, #6be4d1 0 10%, transparent 10.5%),
      linear-gradient(135deg, #7057ff, #ad70ff 45%, #ff7fb3 100%);
    color: #25203b;
  }
  .card {
    width: min(920px, 92vw); min-height: 520px;
    background: #fffdf8; border-radius: 38px;
    border: 7px solid #29213f;
    box-shadow: 14px 16px 0 rgba(41,33,63,.28);
    padding: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; border: 1px solid rgba(80,60,140,.12);
  }
  .eyebrow { font-weight: 800; letter-spacing: .18em; text-transform: uppercase; font-size: 14px; opacity: .55; }
  h1 { font-size: clamp(54px, 9vw, 105px); margin: 16px 0 24px; line-height: .9;
    letter-spacing:-.05em; text-shadow:5px 5px 0 #71e2d0,-4px -4px 0 #ff7db4; }
  .prompt {
    font-size: clamp(28px, 4.3vw, 52px); line-height: 1.15; font-weight: 800;
    max-width: 800px; margin: 18px auto 34px; background:#eefcff; border:5px solid #29213f;
    border-radius:26px; padding:30px; box-shadow:8px 9px 0 #ffd34f;
  }
  .meta { font-size: 14px; opacity: .55; margin-top: 18px; }
  button {
    border: 0; border-radius: 999px; padding: 15px 25px; font-size: 17px; font-weight: 800;
    cursor: pointer; margin: 6px;
  }
  #next { background: #ff70ad; color: #211a3b; border:3px solid #29213f; box-shadow:4px 5px 0 #29213f; }
  #reset { background: #72e2d0; color: #29213f; border:3px solid #29213f; box-shadow:4px 5px 0 #29213f; }
  .tiny { position: fixed; right: 18px; bottom: 14px; font-size: 12px; opacity: .35; }
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Miss Telmard • Quick Challenge</div>
  <h1>5 THINGS!</h1>
  <div id="prompt" class="prompt"></div>
  <div>
    <button id="next">NEW CHALLENGE</button>
    <button id="reset">RESET ALL</button>
  </div>
  <div id="meta" class="meta"></div>
</main>
<div class="tiny">Miss Telmard ✦ Progress is saved on this browser.</div>
<script>
  const prompts = [
      "5 things that are orange",
      "5 words or phrases beginning with \"snow\"",
      "5 things you can write with",
      "5 European capitals",
      "5 members of the Royal Family",
      "5 things you can break",
      "5 things that are sharp",
      "3 words beginning with Z",
      "5 things that use a battery",
      "5 Asian foods",
      "5 things you use for cleaning",
      "5 girls' names ending in Y",
      "5 tropical fruits",
      "5 kitchen utensils",
      "5 red foods",
      "5 vegetables",
      "5 things a police officer uses",
      "5 sports you don't need a ball for",
      "5 things associated with Halloween",
      "5 pieces of sports equipment",
      "5 things you can see at an airport",
      "5 hot drinks",
      "5 things you can find in a car",
      "5 ice-cream flavours",
      "5 things that are silver",
      "5 African countries",
      "5 dairy products",
      "5 male singers",
      "5 baby animals",
      "5 six-letter words",
      "5 Harry Potter characters",
      "5 boys' names beginning with B",
      "5 berries",
      "5 pets",
      "5 things you can put on a pizza",
      "5 jobs where people wear a uniform",
      "5 US states",
      "5 things that are cold",
      "5 things you can see in the sky",
      "5 countries beginning with S",
      "5 superheroes",
      "5 green foods",
      "5 things you can see at the beach",
      "5 Asian countries",
      "5 foods you can put in a salad",
      "5 farm animals",
      "5 things that can fly",
      "5 words beginning with \"sun\""
  ];
  const KEY = "lme-five-things-used-v1";

  function getUsed() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch { return []; }
  }
  function setUsed(a) { localStorage.setItem(KEY, JSON.stringify(a)); }

  function draw() {
    let used = getUsed();
    if (used.length >= prompts.length) {
      alert("You've completed all the challenges! Resetting the bank.");
      used = [];
    }
    const available = prompts.map((_,i)=>i).filter(i => !used.includes(i));
    const idx = available[Math.floor(Math.random()*available.length)];
    used.push(idx); setUsed(used);
    document.getElementById("prompt").textContent = prompts[idx];
    document.getElementById("meta").textContent = `${used.length} / ${prompts.length} challenges used`;
  }

  document.getElementById("next").addEventListener("click", draw);
  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("Reset all 5 Things challenges?")) {
      localStorage.removeItem(KEY); draw();
    }
  });
  draw();
</script>
</body>
</html>
